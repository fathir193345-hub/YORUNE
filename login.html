<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0f13">
  <title>Yorune — Login</title>

  <style>
    :root {
      --bg: #0d0f13;
      --surface: #15181e;
      --surface2: #1d2128;
      --border: #292e37;
      --text: #f5f5f7;
      --muted: #969daa;
      --accent: #b889ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 390px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .logo span {
      color: var(--accent);
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 28px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      background: var(--surface2);
      border-radius: 10px;
      margin-bottom: 23px;
    }

    .tab {
      border: 0;
      border-radius: 7px;
      padding: 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      background: var(--accent);
      color: #17121f;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    .form h1 {
      font-size: 21px;
      margin-bottom: 7px;
    }

    .form p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: #c8cbd2;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      height: 46px;
      border-radius: 10px;
      border: 1px solid var(--border);
      outline: none;
      background: var(--surface2);
      color: white;
      padding: 0 13px;
      font-size: 14px;
    }

    .field input:focus {
      border-color: var(--accent);
    }

    .submit {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #17121f;
      font-weight: 800;
      cursor: pointer;
      margin-top: 5px;
    }

    .submit:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 13px;
    }

    .message.error {
      display: block;
      background: rgba(255,105,120,.12);
      color: #ff9ba6;
    }

    .message.success {
      display: block;
      background: rgba(184,137,255,.12);
      color: #d5baff;
    }

    .guest {
      display: block;
      width: 100%;
      margin-top: 15px;
      text-align: center;
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
    }

    .guest:hover {
      color: white;
    }

    .notice {
      text-align: center;
      color: #707680;
      font-size: 10px;
      line-height: 1.5;
      margin-top: 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Yorune<span>.</span>
    </div>

    <div class="subtitle">
      Temukan cerita baru.
    </div>

    <div class="card">

      <div class="tabs">

        <button
          id="loginTab"
          class="tab active"
          type="button"
          onclick="showForm('login')">
          Login
        </button>

        <button
          id="registerTab"
          class="tab"
          type="button"
          onclick="showForm('register')">
          Register
        </button>

      </div>

      <!-- LOGIN -->

      <form
        id="loginForm"
        class="form active"
        onsubmit="login(event)">

        <h1>Selamat datang</h1>

        <p>
          Login untuk mengakses akun Yorune kamu.
        </p>

        <div id="loginMessage" class="message"></div>

        <div class="field">

          <label>Email</label>

          <input
            id="loginEmail"
            type="email"
            placeholder="nama@email.com"
            autocomplete="email"
            required>

        </div>

        <div class="field">

          <label>Password</label>

          <input
            id="loginPassword"
            type="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required>

        </div>

        <button
          id="loginButton"
          class="submit"
          type="submit">
          Login
        </button>

      </form>

      <!-- REGISTER -->

      <form
        id="registerForm"
        class="form"
        onsubmit="register(event)">

        <h1>Buat akun</h1>

        <p>
          Buat akun Yorune untuk menyimpan data tontonanmu.
        </p>

        <div id="registerMessage" class="message"></div>

        <div class="field">

          <label>Username</label>

          <input
            id="registerUsername"
            type="text"
            placeholder="Buat username"
            autocomplete="username"
            minlength="3"
            maxlength="30"
            required>

        </div>

        <div class="field">

          <label>Email</label>

          <input
            id="registerEmail"
            type="email"
            placeholder="nama@email.com"
            autocomplete="email"
            required>

        </div>

        <div class="field">

          <label>Password</label>

          <input
            id="registerPassword"
            type="password"
            placeholder="Minimal 8 karakter"
            autocomplete="new-password"
            minlength="8"
            required>

        </div>

        <div class="field">

          <label>Konfirmasi Password</label>

          <input
            id="registerConfirm"
            type="password"
            placeholder="Ulangi password"
            autocomplete="new-password"
            minlength="8"
            required>

        </div>

        <button
          id="registerButton"
          class="submit"
          type="submit">
          Buat Akun
        </button>

      </form>

      <a
        class="guest"
        href="index.html">
        Lanjut sebagai Guest
      </a>

    </div>

    <div class="notice">
      Akun Yorune menggunakan Supabase Auth.
      Password diproses oleh sistem autentikasi Supabase.
    </div>

  </div>

  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://tggpvzgoxcumxvjnweem.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_sarbxo2XsnvwztX3nA81iA_6dXF-X3n";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    function showForm(type) {

      const loginForm =
        document.getElementById("loginForm");

      const registerForm =
        document.getElementById("registerForm");

      const loginTab =
        document.getElementById("loginTab");

      const registerTab =
        document.getElementById("registerTab");

      loginForm.classList.remove("active");
      registerForm.classList.remove("active");

      loginTab.classList.remove("active");
      registerTab.classList.remove("active");

      if (type === "login") {

        loginForm.classList.add("active");
        loginTab.classList.add("active");

      } else {

        registerForm.classList.add("active");
        registerTab.classList.add("active");

      }
    }


    function showMessage(id, text, type) {

      const element =
        document.getElementById(id);

      element.textContent = text;
      element.className = "message " + type;
    }


    async function register(event) {

      event.preventDefault();

      const button =
        document.getElementById("registerButton");

      const username =
        document
          .getElementById("registerUsername")
          .value
          .trim();

      const email =
        document
          .getElementById("registerEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("registerPassword")
          .value;

      const confirm =
        document
          .getElementById("registerConfirm")
          .value;


      if (username.length < 3) {

        showMessage(
          "registerMessage",
          "Username minimal 3 karakter.",
          "error"
        );

        return;
      }


      if (password.length < 8) {

        showMessage(
          "registerMessage",
          "Password minimal 8 karakter.",
          "error"
        );

        return;
      }


      if (password !== confirm) {

        showMessage(
          "registerMessage",
          "Konfirmasi password tidak sama.",
          "error"
        );

        return;
      }


      button.disabled = true;
      button.textContent = "Membuat akun...";


      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {
              data: {
                username: username
              }
            }

          });


        if (error) {
          throw error;
        }


        if (data.user && !data.session) {

          showMessage(
            "registerMessage",
            "Akun berhasil dibuat! Cek email untuk verifikasi.",
            "success"
          );

          document
            .getElementById("registerForm")
            .reset();

        } else {

          showMessage(
            "registerMessage",
            "Akun berhasil dibuat! Mengalihkan...",
            "success"
          );

          setTimeout(() => {

            window.location.href = "index.html";

          }, 1000);

        }

      } catch (error) {

        console.error(error);

        showMessage(
          "registerMessage",
          getErrorMessage(error),
          "error"
        );

      }


      button.disabled = false;
      button.textContent = "Buat Akun";
    }


    async function login(event) {

      event.preventDefault();

      const button =
        document.getElementById("loginButton");

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;


      button.disabled = true;
      button.textContent = "Login...";


      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({

            email: email,
            password: password

          });


        if (error) {
          throw error;
        }


        showMessage(
          "loginMessage",
          "Login berhasil! Membuka Yorune...",
          "success"
        );


        setTimeout(() => {

          window.location.href = "index.html";

        }, 700);


      } catch (error) {

        console.error(error);

        showMessage(
          "loginMessage",
          getErrorMessage(error),
          "error"
        );

      }


      button.disabled = false;
      button.textContent = "Login";
    }


    function getErrorMessage(error) {

      const message =
        error?.message || "";

      const lower =
        message.toLowerCase();


      if (
        lower.includes("invalid login credentials")
      ) {
        return "Email atau password salah.";
      }


      if (
        lower.includes("email not confirmed")
      ) {
        return "Email belum diverifikasi. Cek inbox email kamu.";
      }


      if (
        lower.includes("user already registered")
      ) {
        return "Email tersebut sudah terdaftar.";
      }


      if (
        lower.includes("password should be at least")
      ) {
        return "Password terlalu pendek.";
      }


      return message ||
        "Terjadi kesalahan. Coba lagi.";
    }


    async function checkSession() {

      const {
        data
      } =
        await supabaseClient.auth.getSession();


      if (data.session) {

        window.location.href =
          "index.html";

      }
    }


    checkSession();

  </script>

</body>
            </html>
