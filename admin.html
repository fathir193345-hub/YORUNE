<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yorune — Admin Episode</title>
<style>
  :root {
    --bg: #0d0f13;
    --surface: #15181e;
    --surface2: #1d2128;
    --border: #292e37;
    --text: #f5f5f7;
    --muted: #969daa;
    --accent: #b889ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    padding: 20px;
    max-width: 560px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
  input, textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px;
    font: inherit;
    outline: none;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 200px; resize: vertical; font-family: monospace; font-size: 13px; }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 0;
    background: var(--accent);
    color: #18121f;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .status {
    margin-top: 14px;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .status.ok { color: #7ee787; }
  .status.err { color: #ff7b72; }
  .authBox { text-align: center; padding: 60px 0; }
  .hint {
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div id="loginRequired" class="authBox" style="display:none;">
  <p>Halaman ini cuma bisa diakses akun admin.</p>
  <p class="hint"><a href="login.html" style="color:var(--accent);">Login dulu →</a></p>
</div>

<div id="adminForm" style="display:none;">
  <h1>Tambah Episode</h1>
  <p class="sub">
    Cari ID anime dari AniList dulu (lihat di URL halaman anime di anilist.co, contoh anilist.co/anime/<b>1</b> berarti ID-nya 1).
    Lalu tempel semua link YouTube episode sekaligus, satu baris per episode.
  </p>

  <label for="animeId">ID Anime (dari AniList)</label>
  <input id="animeId" type="number" placeholder="Contoh: 1">

  <label for="bulkInput">
    Daftar episode — format per baris: <code>nomor_episode: link_atau_id_youtube</code>
  </label>
  <textarea id="bulkInput" placeholder="1: https://youtube.com/watch?v=dQw4w9WgXcQ
2: dQw4w9WgXcQ
3: https://youtu.be/dQw4w9WgXcQ"></textarea>

  <button id="submitBtn" onclick="submitEpisodes()">Simpan Semua Episode</button>

  <div id="status" class="status"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

  const SUPABASE_URL = "https://tggpvzgoxcumxvjnweem.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_sarbxo2XsnvwztX3nA81iA_6dXF-X3n";

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const ADMIN_EMAIL = "fathir193345@gmail.com";

  async function checkAuth() {
    const { data: { session } } = await db.auth.getSession();

    if (!session || session.user.email !== ADMIN_EMAIL) {
      document.getElementById("loginRequired").style.display = "block";
    } else {
      document.getElementById("adminForm").style.display = "block";
    }
  }

  checkAuth();

  function extractYoutubeId(raw) {
    raw = raw.trim();

    // Sudah berupa ID polos (11 karakter, tanpa slash/titik)
    if (/^[a-zA-Z0-9_-]{11}$/.test(raw)) {
      return raw;
    }

    try {
      const url = new URL(raw);

      if (url.hostname.includes("youtu.be")) {
        return url.pathname.slice(1);
      }

      if (url.searchParams.get("v")) {
        return url.searchParams.get("v");
      }

      if (url.pathname.includes("/embed/")) {
        return url.pathname.split("/embed/")[1];
      }

    } catch (e) {
      return null;
    }

    return null;
  }

  async function submitEpisodes() {

    const statusEl = document.getElementById("status");
    const btn = document.getElementById("submitBtn");

    const animeId = Number(document.getElementById("animeId").value);
    const raw = document.getElementById("bulkInput").value;

    if (!Number.isInteger(animeId) || animeId <= 0) {
      statusEl.className = "status err";
      statusEl.textContent = "ID Anime wajib diisi angka yang valid.";
      return;
    }

    const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);

    if (lines.length === 0) {
      statusEl.className = "status err";
      statusEl.textContent = "Belum ada baris episode yang diisi.";
      return;
    }

    const rows = [];
    const errors = [];

    lines.forEach((line, idx) => {

      const match = line.match(/^(\d+)\s*:\s*(.+)$/);

      if (!match) {
        errors.push(`Baris ${idx + 1}: format salah ("${line}")`);
        return;
      }

      const episodeNumber = Number(match[1]);
      const youtubeId = extractYoutubeId(match[2]);

      if (!youtubeId) {
        errors.push(`Baris ${idx + 1}: link/ID YouTube tidak valid ("${match[2]}")`);
        return;
      }

      rows.push({
        anime_id: animeId,
        episode_number: episodeNumber,
        youtube_id: youtubeId
      });

    });

    if (errors.length > 0) {
      statusEl.className = "status err";
      statusEl.textContent = "Ada baris yang gagal diproses:\n" + errors.join("\n");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Menyimpan...";

    const { data, error } = await db
      .from("episodes")
      .upsert(rows, { onConflict: "anime_id,episode_number" })
      .select();

    btn.disabled = false;
    btn.textContent = "Simpan Semua Episode";

    if (error) {
      statusEl.className = "status err";
      statusEl.textContent = "Gagal menyimpan: " + error.message;
      return;
    }

    statusEl.className = "status ok";
    statusEl.textContent = `Berhasil menyimpan ${rows.length} episode untuk anime ID ${animeId}.`;

    document.getElementById("bulkInput").value = "";

  }

</script>
</body>
</html>
