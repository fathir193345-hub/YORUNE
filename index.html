<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0f13">

  <title>Yorune</title>

  <style>
    :root {
      --bg: #0d0f13;
      --surface: #15181e;
      --surface2: #1d2128;
      --border: #292e37;
      --text: #f5f5f7;
      --muted: #969daa;
      --accent: #b889ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 25px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
    }

    .logo span {
      color: var(--accent);
    }

    .auth {
      display: flex;
      gap: 8px;
    }

    .auth a {
      text-decoration: none;
      padding: 9px 15px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
    }

    .login {
      color: var(--text);
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .register {
      color: #17121f;
      background: var(--accent);
    }

    .hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 30px 22px;
      margin-top: 10px;
    }

    .hero h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .hero p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      max-width: 550px;
    }

    .section {
      margin-top: 25px;
    }

    .section h2 {
      font-size: 19px;
      margin-bottom: 13px;
    }

    .empty {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 25px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .app {
        padding: 15px;
      }

      .logo {
        font-size: 24px;
      }

      .auth a {
        padding: 8px 11px;
        font-size: 12px;
      }

      .hero h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>

      <div class="logo">
        Yorune<span>.</span>
      </div>

      <div class="auth">

        <a href="login.html" class="login">
          Login
        </a>

        <a href="login.html" class="register">
          Register
        </a>

      </div>

    </header>


    <main>

      <section class="hero">

        <h1>
          Temukan cerita baru.
        </h1>

        <p>
          Jelajahi berbagai anime dan temukan
          tontonan yang cocok untuk kamu di Yorune.
        </p>

      </section>


      <section class="section">

        <h2>
          Anime Terbaru
        </h2>

        <div class="empty">
          Belum ada daftar anime.
        </div>

      </section>


      <section class="section">

        <h2>
          Populer
        </h2>

        <div class="empty">
          Belum ada daftar anime.
        </div>

      </section>

    </main>

  </div>

</body>
</html>
  </button>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* ==============================
     SUPABASE
     ============================== */

  const SUPABASE_URL =
    "https://tggpvzgoxcumxvjnweem.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_sarbxo2XsnvwztX3nA81iA_6dXF-X3n";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==============================
     ELEMENT
     ============================== */

  const profileButton =
    document.getElementById("profileButton");

  const profilePanel =
    document.getElementById("profilePanel");

  const profileName =
    document.getElementById("profileName");

  const profileEmail =
    document.getElementById("profileEmail");

  const welcomeText =
    document.getElementById("welcomeText");

  const guestBox =
    document.getElementById("guestBox");

  const logoutButton =
    document.getElementById("logoutButton");


  /* ==============================
     PROFILE BUTTON
     ============================== */

  profileButton.addEventListener(
    "click",
    () => {

      profilePanel.classList.toggle("show");

    }
  );


  /* ==============================
     LOAD SESSION
     ============================== */

  async function loadUser() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (!session) {

      // Guest mode

      profileButton.textContent = "?";

      profileName.textContent =
        "Guest";

      profileEmail.textContent =
        "Belum login";

      welcomeText.textContent =
        "Jelajahi Yorune sebagai Guest.";

      guestBox.style.display =
        "block";

      logoutButton.style.display =
        "none";

      return;

    }


    // USER LOGIN

    const user =
      session.user;


    const username =
      user.user_metadata?.username ||
      user.email?.split("@")[0] ||
      "User";


    profileButton.textContent =
      username.charAt(0).toUpperCase();


    profileName.textContent =
      username;


    profileEmail.textContent =
      user.email || "";


    welcomeText.textContent =
      "Halo, " + username +
      "! Selamat datang kembali.";


    guestBox.style.display =
      "none";


    logoutButton.style.display =
      "block";

  }


  /* ==============================
     LOGOUT
     ============================== */

  logoutButton.addEventListener(
    "click",
    async () => {

      logoutButton.disabled =
        true;

      logoutButton.textContent =
        "Logout...";


      const {
        error
      } =
        await supabaseClient.auth.signOut();


      if (error) {

        console.error(error);

        logoutButton.disabled =
          false;

        logoutButton.textContent =
          "Logout";

        return;

      }


      window.location.href =
        "login.html";

    }
  );


  /* ==============================
     SEARCH
     ============================== */

  document
    .getElementById("searchInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          const keyword =
            this.value.trim();

          if (!keyword) {
            return;
          }

          alert(
            "Pencarian \"" +
            keyword +
            "\" belum tersedia."
          );

        }

      }
    );


  /* ==============================
     MENU SEMENTARA
     ============================== */

  function comingSoon(name) {

    alert(
      name +
      " belum tersedia. Fitur ini bisa kita sambungkan berikutnya."
    );

  }


  /* ==============================
     START
     ============================== */

  loadUser();

</script>

</body>
  </html>
