<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0f13">

  <title>Yorune</title>

  <style>
    :root {
      --bg: #0d0f13;
      --surface: #15181e;
      --surface2: #1d2128;
      --border: #292e37;
      --text: #f5f5f7;
      --muted: #969daa;
      --accent: #b889ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* HEADER */

    .header {
      position: sticky;
      top: 0;
      z-index: 20;

      height: 62px;
      padding: 0 17px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(13,15,19,.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .logo span {
      color: var(--accent);
    }

    .profile-button {
      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 50%;

      background: var(--accent);
      color: #17121f;

      font-weight: 800;
    }

    /* CONTENT */

    .content {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 22px 16px;
    }

    .welcome {
      margin-bottom: 22px;
    }

    .welcome h1 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 13px;
    }

    /* SEARCH */

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
    }

    .search-box input {
      flex: 1;
      height: 45px;

      padding: 0 13px;

      border: 1px solid var(--border);
      border-radius: 11px;

      outline: none;

      background: var(--surface);
      color: white;
    }

    .search-box input::placeholder {
      color: #707680;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box button {
      width: 48px;
      height: 45px;

      border: 0;
      border-radius: 11px;

      background: var(--accent);
      color: #17121f;

      font-size: 17px;
    }

    /* SECTION */

    .section {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 18px;
      margin-bottom: 13px;
    }

    /* GENRE */

    .genres {
      display: flex;
      gap: 8px;

      overflow-x: auto;
      padding-bottom: 5px;

      scrollbar-width: none;
    }

    .genres::-webkit-scrollbar {
      display: none;
    }

    .genre {
      flex-shrink: 0;

      padding: 8px 13px;

      border: 1px solid var(--border);
      border-radius: 20px;

      background: var(--surface);
      color: var(--muted);

      font-size: 12px;
    }

    .genre.active {
      border-color: var(--accent);
      background: rgba(184,137,255,.12);
      color: var(--accent);
    }

    /* ANIME */

    .anime-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px;
    }

    @media (min-width: 600px) {
      .anime-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .anime-card {
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 13px;

      background: var(--surface);
    }

    .anime-cover {
      aspect-ratio: 2 / 3;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 12px;

      background:
        linear-gradient(
          145deg,
          #292232,
          #17191f
        );

      color: #c9c1d8;

      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .anime-info {
      padding: 10px;
    }

    .anime-title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
    }

    .anime-meta {
      margin-top: 5px;

      color: var(--muted);

      font-size: 10px;
      line-height: 1.4;
    }

    .empty {
      display: none;

      padding: 35px 15px;

      border: 1px dashed var(--border);
      border-radius: 13px;

      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    /* PROFILE */

    .profile-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: none;

      align-items: flex-end;
      justify-content: center;

      background: rgba(0,0,0,.65);
      backdrop-filter: blur(5px);
    }

    .profile-overlay.active {
      display: flex;
    }

    .profile-card {
      width: 100%;
      max-width: 500px;

      padding: 22px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-bottom: 0;

      border-radius: 20px 20px 0 0;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 13px;

      margin-bottom: 20px;
    }

    .avatar {
      width: 52px;
      height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: var(--accent);
      color: #17121f;

      font-size: 20px;
      font-weight: 800;
    }

    .profile-name {
      font-size: 17px;
      font-weight: 800;
    }

    .profile-email {
      margin-top: 3px;

      color: var(--muted);
      font-size: 11px;
    }

    .profile-action {
      width: 100%;

      padding: 14px 0;

      border: 0;
      border-bottom: 1px solid var(--border);

      background: transparent;

      color: var(--text);
      text-align: left;

      font-size: 13px;
    }

    .profile-action.logout {
      color: #ff8d99;
    }

    .close-profile {
      width: 100%;
      height: 43px;

      margin-top: 13px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--surface2);
      color: var(--text);
    }

    /* LOADING */

    .loading {
      padding: 40px 10px;

      color: var(--muted);
      text-align: center;

      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="logo">
      Yorune<span>.</span>
    </div>

    <button
      id="profileButton"
      class="profile-button"
      type="button"
      onclick="openProfile()">
      ?
    </button>

  </header>


  <!-- CONTENT -->

  <main class="content">

    <section class="welcome">

      <h1 id="welcomeTitle">
        Selamat datang
      </h1>

      <p>
        Temukan cerita baru untuk ditonton.
      </p>

    </section>


    <!-- SEARCH -->

    <div class="search-box">

      <input
        id="searchInput"
        type="search"
        placeholder="Cari anime..."
        autocomplete="off">

      <button
        type="button"
        onclick="searchAnime()">
        🔍
      </button>

    </div>


    <!-- GENRE -->

    <section class="section">

      <h2 class="section-title">
        Genre
      </h2>

      <div class="genres">

        <button
          class="genre active"
          type="button"
          onclick="filterGenre('Semua', this)">
          Semua
        </button>

        <button
          class="genre"
          type="button"
          onclick="filterGenre('Action', this)">
          Action
        </button>

        <button
          class="genre"
          type="button"
          onclick="filterGenre('Adventure', this)">
          Adventure
        </button>

        <button
          class="genre"
          type="button"
          onclick="filterGenre('Comedy', this)">
          Comedy
        </button>

        <button
          class="genre"
          type="button"
          onclick="filterGenre('Fantasy', this)">
          Fantasy
        </button>

        <button
          class="genre"
          type="button"
          onclick="filterGenre('Romance', this)">
          Romance
        </button>

        <button
          class="genre"
          type="button"
          onclick="filterGenre('Isekai', this)">
          Isekai
        </button>

        <button
          class="genre"
          type="button"
          onclick="filterGenre('Drama', this)">
          Drama
        </button>

      </div>

    </section>


    <!-- ANIME -->

    <section class="section">

      <h2
        id="animeTitle"
        class="section-title">
        Anime
      </h2>

      <div
        id="loading"
        class="loading">
        Memuat...
      </div>

      <div
        id="animeGrid"
        class="anime-grid">
      </div>

      <div
        id="empty"
        class="empty">
        Anime tidak ditemukan.
      </div>

    </section>

  </main>

</div>


<!-- PROFILE -->

<div
  id="profileOverlay"
  class="profile-overlay"
  onclick="closeOutside(event)">

  <div class="profile-card">

    <div class="profile-header">

      <div
        id="avatar"
        class="avatar">
        ?
      </div>

      <div>

        <div
          id="profileName"
          class="profile-name">
          User
        </div>

        <div
          id="profileEmail"
          class="profile-email">
          -
        </div>

      </div>

    </div>


    <button
      class="profile-action"
      type="button">
      👤 Profil akun
    </button>


    <button
      class="profile-action"
      type="button">
      ⚙️ Pengaturan
    </button>


    <button
      class="profile-action logout"
      type="button"
      onclick="logout()">
      Keluar dari akun
    </button>


    <button
      class="close-profile"
      type="button"
      onclick="closeProfile()">
      Tutup
    </button>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* =====================================
     SUPABASE CONFIG
     ===================================== */

  const SUPABASE_URL =
    "https://tggpvzgoxcumxvjnweem.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_sarbxo2XsnvwztX3nA81iA_6dXF-X3n";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================
     DATA ANIME
     ===================================== */

  const animeList = [

    {
      title: "Frieren: Beyond Journey's End",
      genres: ["Adventure", "Fantasy", "Drama"],
      type: "TV"
    },

    {
      title: "The Apothecary Diaries",
      genres: ["Drama", "Romance"],
      type: "TV"
    },

    {
      title: "KonoSuba",
      genres: ["Comedy", "Fantasy", "Isekai"],
      type: "TV"
    },

    {
      title: "Re:ZERO",
      genres: ["Fantasy", "Isekai", "Drama"],
      type: "TV"
    },

    {
      title: "One Punch Man",
      genres: ["Action", "Comedy"],
      type: "TV"
    },

    {
      title: "That Time I Got Reincarnated as a Slime",
      genres: ["Action", "Fantasy", "Isekai"],
      type: "TV"
    },

    {
      title: "Horimiya",
      genres: ["Romance", "Comedy", "Drama"],
      type: "TV"
    },

    {
      title: "Delicious in Dungeon",
      genres: ["Adventure", "Comedy", "Fantasy"],
      type: "TV"
    }

  ];


  let currentGenre = "Semua";
  let currentSearch = "";


  /* =====================================
     CEK LOGIN
     ===================================== */

  async function checkUser() {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {

      console.error(
        "Session error:",
        error
      );

      window.location.href =
        "login.html";

      return;

    }


    const session =
      data.session;


    /*
      BELUM LOGIN
      */

    if (!session) {

      window.location.replace(
        "login.html"
      );

      return;

    }


    /*
      SUDAH LOGIN
      */

    const user =
      session.user;


    const username =
      user.user_metadata?.username ||
      user.email?.split("@")[0] ||
      "User";


    document
      .getElementById("welcomeTitle")
      .textContent =
      "Halo, " + username;


    document
      .getElementById("profileName")
      .textContent =
      username;


    document
      .getElementById("profileEmail")
      .textContent =
      user.email || "-";


    const initial =
      username
        .charAt(0)
        .toUpperCase();


    document
      .getElementById("avatar")
      .textContent =
      initial;


    document
      .getElementById("profileButton")
      .textContent =
      initial;


    document
      .getElementById("loading")
      .style.display =
      "none";


    renderAnime();

  }


  /* =====================================
     RENDER ANIME
     ===================================== */

  function renderAnime() {

    const grid =
      document.getElementById("animeGrid");

    const empty =
      document.getElementById("empty");


    grid.innerHTML = "";


    const results =
      animeList.filter(anime => {

        const genreMatch =
          currentGenre === "Semua" ||
          anime.genres.includes(
            currentGenre
          );


        const searchMatch =
          anime.title
            .toLowerCase()
            .includes(
              currentSearch.toLowerCase()
            );


        return genreMatch && searchMatch;

      });


    if (results.length === 0) {

      empty.style.display =
        "block";

      return;

    }


    empty.style.display =
      "none";


    results.forEach(anime => {

      const card =
        document.createElement("div");


      card.className =
        "anime-card";


      card.innerHTML = `

        <div class="anime-cover">
          ${escapeHTML(anime.title)}
        </div>

        <div class="anime-info">

          <div class="anime-title">
            ${escapeHTML(anime.title)}
          </div>

          <div class="anime-meta">
            ${escapeHTML(anime.type)}
            •
            ${anime.genres.map(
              escapeHTML
            ).join(" • ")}
          </div>

        </div>

      `;


      grid.appendChild(card);

    });

  }


  /* =====================================
     SEARCH
     ===================================== */

  function searchAnime() {

    currentSearch =
      document
        .getElementById("searchInput")
        .value
        .trim();


    document
      .getElementById("animeTitle")
      .textContent =
      currentSearch
        ? "Hasil pencarian"
        : "Anime";


    renderAnime();

  }


  document
    .getElementById("searchInput")
    .addEventListener(
      "input",
      searchAnime
    );


  /* =====================================
     GENRE
     ===================================== */

  function filterGenre(
    genre,
    button
  ) {

    currentGenre =
      genre;


    document
      .querySelectorAll(".genre")
      .forEach(item => {

        item.classList.remove(
          "active"
        );

      });


    button.classList.add(
      "active"
    );


    renderAnime();

  }


  /* =====================================
     PROFILE
     ===================================== */

  function openProfile() {

    document
      .getElementById("profileOverlay")
      .classList.add("active");

  }


  function closeProfile() {

    document
      .getElementById("profileOverlay")
      .classList.remove("active");

  }


  function closeOutside(event) {

    if (
      event.target.id ===
      "profileOverlay"
    ) {

      closeProfile();

    }

  }


  /* =====================================
     LOGOUT
     ===================================== */

  async function logout() {

    const confirmLogout =
      confirm(
        "Yakin ingin keluar dari akun?"
      );


    if (!confirmLogout) {
      return;
    }


    const {
      error
    } =
      await supabaseClient.auth.signOut();


    if (error) {

      alert(
        "Gagal logout: " +
        error.message
      );

      return;

    }


    window.location.replace(
      "login.html"
    );

  }


  /* =====================================
     ESCAPE HTML
     ===================================== */

  function escapeHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =====================================
     START
     ===================================== */

  checkUser();


  /* =====================================
     SESSION LISTENER
     ===================================== */

  supabaseClient.auth.onAuthStateChange(
    (event, session) => {

      if (
        event === "SIGNED_OUT" ||
        !session
      ) {

        window.location.replace(
          "login.html"
        );

      }

    }
  );

</script>

</body>
</html>
